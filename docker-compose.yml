services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: face_recognition
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d face_recognition"]
      interval: 5s
      timeout: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.15.5
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://admin:admin123@postgres:5432/face_recognition
      QDRANT_HOST: qdrant
      SECRET_KEY: ${SECRET_KEY:-local-demo-secret-change-me}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin123}
      FACE_DETECTOR: ${FACE_DETECTOR:-retinaface}
    ports:
      - "8000:8000"
    volumes:
      - model_cache:/models
      - media:/media
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  model_cache:
  media:
